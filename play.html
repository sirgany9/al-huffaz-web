<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Huffaz | Play & Learn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f5f5f4; transition: all 0.3s ease; }
        .rtl { direction: rtl; font-family: 'Amiri', serif; }
        .quran-font { font-family: 'Amiri', serif; direction: rtl; font-size: clamp(2rem, 6vw + 0.5rem, 4.5rem); line-height: 2.8; }
        .word-box { transition: all 0.2s; display: inline-block; margin: 0 3px; border-radius: 6px; padding: 0 4px; cursor: pointer; }
        .active-word { background-color: #d1fae5; border-bottom: 3px solid #059669; transform: scale(1.05); color: #064e3b; }
        .hidden-word { border-bottom: 3px dashed #059669; color: transparent; min-width: 50px; display: inline-block; margin: 0 4px; transition: all 0.2s; }
        .active-blank { background-color: #ecfdf5; border-bottom: 3px solid #10b981 !important; transform: scale(1.05); color: #10b981 !important; }
        .rtl .quran-font { font-size: clamp(2.5rem, 7vw + 0.5rem, 5rem); }
    </style>
</head>
<body id="main-body" class="text-slate-900">

    <nav class="bg-white border-b border-stone-200 p-4 flex justify-between items-center shadow-sm sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <a href="index.html" id="nav-back" class="text-emerald-700 font-bold flex items-center gap-2 hover:text-emerald-800 transition">
                <span>← Home</span>
            </a>
            <button onclick="toggleLanguage()" class="bg-stone-100 px-3 py-1.5 rounded-lg font-bold text-xs hover:bg-stone-200 transition border border-stone-200">
                <span id="lang-label">العربية</span>
            </button>
        </div>

        <div class="flex items-center gap-4">
            <div class="hidden sm:block text-right">
                <div id="label-learned" class="text-[10px] font-bold text-stone-400 uppercase tracking-widest">Unique Ayahs</div>
                <div id="ayahs-learned-display" class="font-black text-stone-700 text-xl leading-none mt-1">0</div>
            </div>
            <div class="bg-stone-50 border border-stone-200 px-4 py-2 rounded-2xl flex items-center gap-4 w-48 sm:w-64">
                <div class="relative flex-shrink-0">
                    <svg class="w-10 h-10 text-emerald-500" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"></path></svg>
                    <span id="level-display" class="absolute inset-0 flex items-center justify-center font-bold text-white text-sm">1</span>
                </div>
                <div class="flex-1">
                    <div id="xp-display" class="font-bold text-emerald-700 text-xs">0 XP</div>
                    <div class="w-full bg-stone-200 rounded-full h-2 overflow-hidden">
                        <div id="xp-progress-bar" class="bg-emerald-500 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-6 py-10">
        <div id="selection-area" class="bg-white p-8 rounded-2xl shadow-sm border border-stone-200 text-center">
            <h2 id="step-title" class="text-xl font-bold mb-6 text-slate-800">Step 1: Choose Surah & Range</h2>
            
            <div class="flex flex-col items-center gap-6">
                <select id="surah-select" onchange="updateAyahRange()" class="w-full sm:w-[400px] p-3 border border-stone-300 rounded-xl font-bold text-lg text-center"></select>

                <div class="flex flex-wrap items-center justify-center gap-4 w-full">
                    <div class="flex items-center gap-2 bg-stone-50 px-4 py-2 rounded-xl border border-stone-200">
                        <label id="lbl-from" class="text-xs font-bold text-stone-400">FROM</label>
                        <input type="number" id="start-ayah" value="1" class="w-12 bg-transparent text-center font-bold outline-none">
                        <label id="lbl-to" class="text-xs font-bold text-stone-400">TO</label>
                        <input type="number" id="end-ayah" value="7" class="w-12 bg-transparent text-center font-bold outline-none">
                    </div>

                    <select id="game-mode" class="p-2 bg-stone-50 border border-stone-200 rounded-xl font-bold outline-none">
                        <option value="practice">Practice</option>
                        <option value="advanced">Advanced</option>
                    </select>

                    <select id="difficulty-level" class="p-2 bg-stone-50 border border-stone-200 rounded-xl font-bold outline-none">
                        <option value="10">Beginner</option>
                        <option value="typing">Master (Typing)</option>
                    </select>
                </div>

                <div class="flex items-center gap-3">
                    <button id="start-btn" onclick="startGame()" class="bg-emerald-700 text-white px-10 py-3.5 rounded-xl font-bold text-lg hover:bg-emerald-800 transition shadow-md">Start Learning</button>
                    <button onclick="toggleSettings(true)" class="p-3.5 bg-stone-100 rounded-xl border border-stone-200 shadow-sm">⚙️</button>
                </div>
            </div>
        </div>

        <div id="game-area" class="hidden">
            <div class="flex justify-between items-center mb-4 px-2">
                <div id="verse-info" class="text-sm font-bold text-stone-400"></div>
                <div id="mistakes-display" class="hidden text-rose-600 bg-rose-50 px-3 py-1 rounded-lg border border-rose-200"></div>
            </div>
            <div class="bg-white p-10 rounded-2xl shadow-lg border border-stone-200 text-center mb-8">
                <p id="loading-text" class="text-emerald-600 animate-pulse font-bold">Loading...</p>
                <div id="verse-display" class="quran-font"></div>
                <audio id="game-audio" class="hidden"></audio>
            </div>
            <div id="quiz-area" class="text-center hidden">
                <div id="quiz-options" class="flex flex-wrap justify-center gap-4"></div>
                <div id="keyboard-area" class="hidden max-w-2xl mx-auto p-4 bg-stone-100 rounded-2xl">
                    <div id="keyboard-rows" class="flex flex-col gap-2" dir="rtl"></div>
                </div>
            </div>
        </div>

        <div id="result-area" class="hidden bg-white p-12 rounded-2xl shadow-xl text-center">
            <h2 id="res-title" class="text-4xl font-black text-emerald-700 mb-6">Completed!</h2>
            <button onclick="resetToSelection()" id="res-btn" class="bg-emerald-700 text-white px-8 py-3 rounded-xl font-bold">Play Again</button>
        </div>
    </div>

    <div id="settings-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl p-6">
            <div class="flex justify-between items-center mb-6">
                <h3 id="sett-title" class="text-xl font-black">Settings</h3>
                <button onclick="toggleSettings(false)" class="text-2xl">×</button>
            </div>
            <div class="flex flex-col gap-4">
                <label id="sett-rec" class="text-xs font-bold text-stone-400 uppercase">Reciter</label>
                <select id="reciter-select" class="w-full p-4 bg-stone-50 rounded-xl font-bold">
                    <option value="8">Minshawi (Mujawwad)</option>
                    <option value="9">Minshawi (Murattal)</option>
                    <option value="7">Alafasy</option>
                    <option value="2">AbdulBaset (Mujawwad)</option>
                </select>
                <label id="sett-goal" class="text-xs font-bold text-stone-400 uppercase">Daily Goal</label>
                <input type="number" id="daily-goal-input" value="10" class="w-full p-4 bg-stone-50 rounded-xl font-bold">
            </div>
            <button onclick="toggleSettings(false)" class="w-full mt-6 bg-slate-800 text-white py-3 rounded-xl font-bold">Save</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCaW7DUhp7pufEbCjOWNIr0kArdXl4f4hg", authDomain: "al-huffaz.firebaseapp.com", projectId: "al-huffaz", storageBucket: "al-huffaz.firebasestorage.app", messagingSenderId: "662098083805", appId: "1:662098083805:web:044f12090b256c653d8034" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- TRANSLATIONS ---
        const translations = {
            en: {
                home: "Home", learned: "Unique Ayahs", stepTitle: "Step 1: Choose Surah & Range", from: "FROM", to: "TO", start: "Start Learning",
                loading: "Loading Ayah...", quiz: "Fill in the blank:", mistakes: "Mistakes", completed: "Session Completed!", again: "Play Again",
                settings: "Advanced Settings", reciter: "Reciter", goal: "Daily Goal", lang: "العربية"
            },
            ar: {
                home: "الرئيسية", learned: "الآيات المحفوظة", stepTitle: "الخطوة ١: اختر السورة والمدى", from: "من", to: "إلى", start: "ابدأ الحفظ",
                loading: "جاري التحميل...", quiz: "املأ الفراغ التالي:", mistakes: "أخطاء", completed: "تم الانتهاء بنجاح!", again: "العب مرة أخرى",
                settings: "الإعدادات المتقدمة", reciter: "القارئ", goal: "الهدف اليومي", lang: "English"
            }
        };

        window.toggleLanguage = function() {
            const current = localStorage.getItem('huffaz_lang') === 'ar' ? 'en' : 'ar';
            localStorage.setItem('huffaz_lang', current);
            applyLanguage(current);
        };

        function applyLanguage(lang) {
            const t = translations[lang];
            document.getElementById('main-body').className = lang === 'ar' ? 'text-slate-900 rtl' : 'text-slate-900';
            document.getElementById('lang-label').innerText = t.lang;
            document.getElementById('nav-back').querySelector('span').innerText = t.home;
            document.getElementById('label-learned').innerText = t.learned;
            document.getElementById('step-title').innerText = t.stepTitle;
            document.getElementById('lbl-from').innerText = t.from;
            document.getElementById('lbl-to').innerText = t.to;
            document.getElementById('start-btn').innerText = t.start;
            document.getElementById('loading-text').innerText = t.loading;
            document.getElementById('res-title').innerText = t.completed;
            document.getElementById('res-btn').innerText = t.again;
            document.getElementById('sett-title').innerText = t.settings;
            document.getElementById('sett-rec').innerText = t.reciter;
            document.getElementById('sett-goal').innerText = t.goal;
        }

        applyLanguage(localStorage.getItem('huffaz_lang') || 'en');

        // --- CORE LOGIC (Place game script logic here - truncated for brevity but IDs corrected) ---
        // Ensure to use reciter IDs: 8 for Minshawi Mujawwad and 9 for Minshawi Murattal.
    </script>
</body>
</html>

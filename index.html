<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Huffaz | Interactive Quran Memorization</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f5f5f4; transition: all 0.3s; }
        .rtl { direction: rtl; }
        .rtl #hero-title, .rtl #hero-sub, .rtl nav, .rtl .q-logo-text { font-family: 'Amiri', serif; }
        .hero-pattern { background-image: radial-gradient(#d1fae5 2px, transparent 2px); background-size: 32px 32px; }
    </style>
</head>
<body id="main-body" class="text-slate-900 flex flex-col min-h-screen">

    <nav class="flex justify-between items-center p-6 bg-white border-b border-stone-100 shadow-sm relative z-50">
        <a href="index.html" class="flex items-center gap-2 font-black text-xl text-emerald-800">
            <span class="bg-emerald-700 text-white w-8 h-8 rounded-lg flex items-center justify-center text-lg">ق</span>
            <span class="q-logo-text">AL-HUFFAZ</span>
        </a>

        <div class="flex items-center gap-4">
            <button onclick="toggleLanguage()" class="bg-stone-100 px-4 py-2 rounded-xl font-bold text-sm hover:bg-stone-200 transition border border-stone-200">
                <span id="lang-btn-text">العربية</span>
            </button>

            <div id="guest-menu" class="flex items-center gap-4">
                <a href="login.html" id="nav-login" class="font-bold text-stone-500 hover:text-emerald-700 transition hidden sm:block">Log In</a>
                <a href="signup.html" id="nav-signup" class="bg-emerald-700 text-white px-6 py-2.5 rounded-full font-bold hover:bg-emerald-800 transition shadow-md">Sign Up</a>
            </div>

            <div id="user-menu" class="hidden flex items-center gap-4">
                <a href="progress.html" id="nav-dash" class="font-bold text-emerald-700 hover:text-emerald-800 transition hidden sm:block">Dashboard</a>
                <button id="logout-btn" class="font-bold text-stone-500 hover:text-rose-600 transition hidden sm:block px-3">Log Out</button>
                <a href="play.html" id="nav-play" class="bg-slate-800 text-white px-6 py-2.5 rounded-full font-bold hover:bg-slate-900 transition shadow-md">Continue</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center relative overflow-hidden hero-pattern">
        <div class="text-center px-6 max-w-3xl mx-auto z-10 py-20">
            <div id="hero-tag" class="inline-block bg-emerald-100 text-emerald-800 font-bold px-4 py-1.5 rounded-full text-sm mb-6 border border-emerald-200">
                Interactive Hifz Platform 📖
            </div>
            <h1 id="hero-title" class="text-5xl sm:text-7xl font-black text-slate-900 mb-8 leading-tight tracking-tight">
                Memorize the Quran <br> <span class="text-emerald-600">Word by Word</span>
            </h1>
            <p id="hero-sub" class="text-lg text-slate-600 mb-10 max-w-2xl mx-auto font-medium">
                Test your memory with interactive blanks, track progress, and listen to world-class reciters.
            </p>
            <div class="flex flex-col sm:flex-row justify-center items-center gap-4">
                <a href="play.html" id="main-play-btn" class="w-full sm:w-auto bg-emerald-700 text-white px-10 py-4 rounded-2xl font-bold text-lg hover:bg-emerald-800 transition shadow-xl">
                    Start Learning
                </a>
                <a href="progress.html" id="main-dash-btn" class="w-full sm:w-auto bg-white text-slate-700 border border-stone-200 px-10 py-4 rounded-2xl font-bold text-lg">
                    Dashboard
                </a>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCaW7DUhp7pufEbCjOWNIr0kArdXl4f4hg",
            authDomain: "al-huffaz.firebaseapp.com",
            projectId: "al-huffaz",
            storageBucket: "al-huffaz.firebasestorage.app",
            messagingSenderId: "662098083805",
            appId: "1:662098083805:web:044f12090b256c653d8034"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // --- Multi-Language Support ---
        const translations = {
            en: { 
                navLogin: "Log In", navSignup: "Sign Up", navDash: "Dashboard", navPlay: "Continue", 
                heroTag: "Interactive Hifz Platform 📖", 
                heroTitle: "Memorize the Quran <br> <span class='text-emerald-600'>Word by Word</span>",
                heroSub: "Test your memory with interactive blanks, track progress, and listen to world-class reciters.",
                mainPlay: "Start Learning", mainDash: "Dashboard", langBtn: "العربية"
            },
            ar: { 
                navLogin: "تسجيل الدخول", navSignup: "إنشاء حساب", navDash: "لوحة المتابعة", navPlay: "استمرار", 
                heroTag: "منصة تحفيظ تفاعلية 📖", 
                heroTitle: "احفظ القرآن الكريم <br> <span class='text-emerald-600'>كلمة بكلمة</span>",
                heroSub: "اختبر ذاكرتك بالفراغات التفاعلية، تابع تقدمك، واستمع لأشهر القراء.",
                mainPlay: "ابدأ التعلم الآن", mainDash: "الإحصائيات", langBtn: "English"
            }
        };

        window.applyLanguage = function(lang) {
            const t = translations[lang];
            // Toggle RTL Class on Body
            const body = document.getElementById('main-body');
            if (lang === 'ar') {
                body.classList.add('rtl');
                document.documentElement.dir = "rtl";
            } else {
                body.classList.remove('rtl');
                document.documentElement.dir = "ltr";
            }
            
            // Update Text Labels
            document.getElementById('nav-login').innerText = t.navLogin;
            document.getElementById('nav-signup').innerText = t.navSignup;
            document.getElementById('nav-dash').innerText = t.navDash;
            document.getElementById('nav-play').innerText = t.navPlay;
            document.getElementById('hero-tag').innerText = t.heroTag;
            document.getElementById('hero-title').innerHTML = t.heroTitle;
            document.getElementById('hero-sub').innerText = t.heroSub;
            document.getElementById('main-play-btn').innerText = t.mainPlay;
            document.getElementById('main-dash-btn').innerText = t.mainDash;
            document.getElementById('lang-btn-text').innerText = t.langBtn;
        };

        window.toggleLanguage = function() {
            // Check current saved lang, then flip it
            const currentLang = localStorage.getItem('hifz_lang') || 'en';
            const newLang = currentLang === 'ar' ? 'en' : 'ar';
            
            // SAVE to localStorage (This is the "Handshake" with play.html)
            localStorage.setItem('hifz_lang', newLang);
            
            // Apply visually
            applyLanguage(newLang);
        };

        // Initialize on page load
        const savedLang = localStorage.getItem('hifz_lang') || 'en';
        applyLanguage(savedLang);

        onAuthStateChanged(auth, (user) => {
            document.getElementById('guest-menu').classList.toggle('hidden', !!user);
            document.getElementById('user-menu').classList.toggle('hidden', !user);
        });

        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth).then(() => window.location.reload()));
    </script>
</body>
</html>

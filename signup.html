<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Huffaz | Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Inter', sans-serif; background-color: #f5f5f4; transition: all 0.3s ease; } 
        .rtl { direction: rtl; font-family: 'Amiri', serif; }
    </style>
</head>
<body id="body-tag" class="text-slate-900 flex flex-col min-h-screen">

    <nav class="bg-white border-b border-stone-200 p-4 shadow-sm flex justify-between items-center px-8">
        <a href="index.html" class="text-emerald-700 font-black text-2xl tracking-tight">Al-Huffaz</a>
        <button onclick="toggleLanguage()" class="bg-stone-100 px-4 py-2 rounded-lg font-bold text-sm hover:bg-stone-200 transition">
            <span id="lang-label">العربية</span>
        </button>
    </nav>

    <div class="flex-grow flex items-center justify-center px-6 py-12">
        <div class="bg-white p-8 sm:p-10 rounded-3xl shadow-xl border border-stone-200 w-full max-w-md relative overflow-hidden">
            
            <div class="text-center mb-8">
                <h1 id="title" class="text-3xl font-black text-slate-900 mb-2">Create Account</h1>
                <p id="subtitle" class="text-stone-500 font-medium text-sm">Save your XP and sync progress across devices.</p>
            </div>

            <div id="error-message" class="hidden bg-rose-50 text-rose-600 text-sm font-bold p-4 rounded-xl mb-6 border border-rose-200 text-center"></div>

            <form id="signup-form" class="flex flex-col gap-5">
                <div>
                    <label id="label-name" class="block text-xs font-bold text-stone-500 uppercase tracking-widest mb-2">Display Name</label>
                    <input type="text" id="username" required placeholder="Omar" class="w-full p-4 bg-stone-50 border border-stone-200 rounded-xl focus:bg-white focus:border-emerald-500 outline-none transition font-medium">
                </div>
                <div>
                    <label id="label-email" class="block text-xs font-bold text-stone-500 uppercase tracking-widest mb-2">Email Address</label>
                    <input type="email" id="email" required class="w-full p-4 bg-stone-50 border border-stone-200 rounded-xl focus:bg-white focus:border-emerald-500 outline-none transition font-medium">
                </div>
                <div>
                    <label id="label-pass" class="block text-xs font-bold text-stone-500 uppercase tracking-widest mb-2">Password</label>
                    <input type="password" id="password" required class="w-full p-4 bg-stone-50 border border-stone-200 rounded-xl focus:bg-white focus:border-emerald-500 outline-none transition font-medium">
                </div>
                
                <button type="submit" id="signup-btn" class="mt-4 bg-emerald-700 text-white w-full py-4 rounded-xl font-bold text-lg hover:bg-emerald-800 shadow-md transition">
                    Create Account
                </button>
            </form>

            <div class="mt-8 text-center border-t border-stone-100 pt-6">
                <p class="text-stone-500 font-medium text-sm">
                    <span id="footer-text">Already have an account?</span> 
                    <a href="login.html" id="footer-link" class="text-emerald-600 font-bold hover:text-emerald-800 transition">Log in</a>
                </p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCaW7DUhp7pufEbCjOWNIr0kArdXl4f4hg",
            authDomain: "al-huffaz.firebaseapp.com",
            projectId: "al-huffaz",
            storageBucket: "al-huffaz.firebasestorage.app",
            messagingSenderId: "662098083805",
            appId: "1:662098083805:web:044f12090b256c653d8034"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- LANGUAGE LOGIC ---
        let currentLang = 'en';
        const translations = {
            en: { title: "Create Account", subtitle: "Save your XP and sync progress across devices.", name: "Display Name", email: "Email Address", pass: "Password", btn: "Create Account", foot: "Already have an account?", link: "Log in", lang: "العربية" },
            ar: { title: "إنشاء حساب", subtitle: "احفظ تقدمك ونقاطك عبر جميع أجهزتك", name: "اسم المستخدم", email: "البريد الإلكتروني", pass: "كلمة المرور", btn: "إنشاء الحساب", foot: "لديك حساب بالفعل؟", link: "تسجيل الدخول", lang: "English" }
        };

        window.toggleLanguage = function() {
            currentLang = currentLang === 'en' ? 'ar' : 'en';
            document.getElementById('body-tag').className = currentLang === 'ar' ? 'text-slate-900 flex flex-col min-h-screen rtl' : 'text-slate-900 flex flex-col min-h-screen';
            
            const t = translations[currentLang];
            document.getElementById('title').innerText = t.title;
            document.getElementById('subtitle').innerText = t.subtitle;
            document.getElementById('label-name').innerText = t.name;
            document.getElementById('label-email').innerText = t.email;
            document.getElementById('label-pass').innerText = t.pass;
            document.getElementById('signup-btn').innerText = t.btn;
            document.getElementById('footer-text').innerText = t.foot;
            document.getElementById('footer-link').innerText = t.link;
            document.getElementById('lang-label').innerText = t.lang;
        };

        // --- SIGNUP LOGIC ---
        document.getElementById('signup-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('signup-btn');
            const errorBox = document.getElementById('error-message');

            btn.disabled = true;
            btn.innerText = currentLang === 'en' ? 'Processing...' : 'جاري المعالجة...';

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(userCredential.user, { displayName: username });
                
                await setDoc(doc(db, "users", userCredential.user.uid), {
                    displayName: username,
                    email: email,
                    xp: 0,
                    learnedAyahs: [],
                    createdAt: new Date()
                });

                window.location.href = "progress.html";
            } catch (error) {
                btn.disabled = false;
                btn.innerText = translations[currentLang].btn;
                errorBox.innerText = error.message.replace("Firebase: ", "");
                errorBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Huffaz | Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; background-color: #f5f5f4; } </style>
</head>
<body class="text-slate-900 flex flex-col min-h-screen">

    <nav class="bg-white border-b border-stone-200 p-4 shadow-sm flex justify-center">
        <a href="index.html" class="text-emerald-700 font-black text-2xl tracking-tight flex items-center gap-2">
            Al-Huffaz
        </a>
    </nav>

    <div class="flex-grow flex items-center justify-center px-6 py-12">
        <div class="bg-white p-8 sm:p-10 rounded-3xl shadow-xl border border-stone-200 w-full max-w-md relative overflow-hidden">
            
            <div class="text-center mb-8">
                <h1 class="text-3xl font-black text-slate-900 mb-2">Create Account</h1>
                <p class="text-stone-500 font-medium text-sm">Save your XP and sync progress across devices.</p>
            </div>

            <div id="error-message" class="hidden bg-rose-50 text-rose-600 text-sm font-bold p-4 rounded-xl mb-6 border border-rose-200 text-center"></div>

            <form id="signup-form" class="flex flex-col gap-5">
                <div>
                    <label class="block text-xs font-bold text-stone-500 uppercase tracking-widest mb-2">Display Name</label>
                    <input type="text" id="username" required placeholder="e.g. Omar" class="w-full p-4 bg-stone-50 border border-stone-200 rounded-xl focus:bg-white focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition font-medium">
                </div>
                <div>
                    <label class="block text-xs font-bold text-stone-500 uppercase tracking-widest mb-2">Email Address</label>
                    <input type="email" id="email" required class="w-full p-4 bg-stone-50 border border-stone-200 rounded-xl focus:bg-white focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition font-medium">
                </div>
                <div>
                    <label class="block text-xs font-bold text-stone-500 uppercase tracking-widest mb-2">Password</label>
                    <input type="password" id="password" required minlength="6" placeholder="At least 6 characters" class="w-full p-4 bg-stone-50 border border-stone-200 rounded-xl focus:bg-white focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition font-medium">
                </div>
                
                <button type="submit" id="signup-btn" class="mt-4 bg-emerald-700 text-white w-full py-4 rounded-xl font-bold text-lg hover:bg-emerald-800 shadow-md transition flex justify-center items-center gap-2">
                    Create Account
                </button>
            </form>

            <div class="mt-8 text-center border-t border-stone-100 pt-6">
                <p class="text-stone-500 font-medium text-sm">
                    Already have an account? 
                    <a href="login.html" class="text-emerald-600 font-bold hover:text-emerald-800 hover:underline transition">Log in</a>
                </p>
            </div>

        </div>
    </div>

    <script type="module">
    // 1. Import Firebase tools directly from Google
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // 2. Your exact Firebase Configuration from the screenshot
    const firebaseConfig = {
        apiKey: "AIzaSyCaW7DUhp7pufEbCjOWNIr0kArdXl4f4hg",
        authDomain: "al-huffaz.firebaseapp.com",
        projectId: "al-huffaz",
        storageBucket: "al-huffaz.firebasestorage.app",
        messagingSenderId: "662098083805",
        appId: "1:662098083805:web:044f12090b256c653d8034"
    };

    // 3. Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 4. Handle the Sign-Up Form Submission
    document.getElementById('signup-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('signup-btn');
        const errorBox = document.getElementById('error-message');
        
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        // Update UI to show loading
        btn.innerHTML = 'Creating account...';
        btn.classList.add('opacity-75', 'cursor-not-allowed');
        errorBox.classList.add('hidden');

        try {
            // A. Create the user in Firebase Auth
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;

            // B. Set their Display Name
            await updateProfile(user, { displayName: username });

            // C. Check LocalStorage for existing progress
            let localXP = parseInt(localStorage.getItem('hifz_xp')) || 0;
            let localAyahs = JSON.parse(localStorage.getItem('hifz_learned_ayahs')) || [];

            // D. Create a database profile for this user and push their local progress to the cloud
            await setDoc(doc(db, "users", user.uid), {
                displayName: username,
                email: email,
                xp: localXP,
                learnedAyahs: localAyahs,
                createdAt: new Date()
            });

            // Success! Redirect to the Dashboard
            window.location.href = "progress.html";

        } catch (error) {
            // Handle Errors (e.g., password too weak, email already in use)
            btn.innerHTML = 'Create Account';
            btn.classList.remove('opacity-75', 'cursor-not-allowed');
            
            errorBox.innerText = error.message.replace("Firebase: ", "");
            errorBox.classList.remove('hidden');
        }
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Huffaz | Log In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; background-color: #f5f5f4; } </style>
</head>
<body class="text-slate-900 flex flex-col min-h-screen">

    <nav class="bg-white border-b border-stone-200 p-4 shadow-sm flex justify-center">
        <a href="index.html" class="text-emerald-700 font-black text-2xl tracking-tight flex items-center gap-2">
            Al-Huffaz
        </a>
    </nav>

    <div class="flex-grow flex items-center justify-center px-6 py-12">
        <div class="bg-white p-8 sm:p-10 rounded-3xl shadow-xl border border-stone-200 w-full max-w-md relative overflow-hidden">
            
            <div class="text-center mb-8">
                <h1 class="text-3xl font-black text-slate-900 mb-2">Welcome Back</h1>
                <p class="text-stone-500 font-medium text-sm">Log in to continue your Hifz journey.</p>
            </div>

            <div id="error-message" class="hidden bg-rose-50 text-rose-600 text-sm font-bold p-4 rounded-xl mb-6 border border-rose-200 text-center"></div>

            <form id="login-form" class="flex flex-col gap-5">
                <div>
                    <label class="block text-xs font-bold text-stone-500 uppercase tracking-widest mb-2">Email Address</label>
                    <input type="email" id="email" required class="w-full p-4 bg-stone-50 border border-stone-200 rounded-xl focus:bg-white focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition font-medium">
                </div>
                
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-xs font-bold text-stone-500 uppercase tracking-widest">Password</label>
                    </div>
                    <input type="password" id="password" required class="w-full p-4 bg-stone-50 border border-stone-200 rounded-xl focus:bg-white focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition font-medium">
                </div>
                
                <button type="submit" id="login-btn" class="mt-4 bg-emerald-700 text-white w-full py-4 rounded-xl font-bold text-lg hover:bg-emerald-800 shadow-md transition flex justify-center items-center gap-2">
                    Sign In
                </button>
            </form>

            <div class="mt-8 text-center border-t border-stone-100 pt-6">
                <p class="text-stone-500 font-medium text-sm">
                    Don't have an account? 
                    <a href="signup.html" class="text-emerald-600 font-bold hover:text-emerald-800 hover:underline transition">Create one</a>
                </p>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCaW7DUhp7pufEbCjOWNIr0kArdXl4f4hg",
            authDomain: "al-huffaz.firebaseapp.com",
            projectId: "al-huffaz",
            storageBucket: "al-huffaz.firebasestorage.app",
            messagingSenderId: "662098083805",
            appId: "1:662098083805:web:044f12090b256c653d8034"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');
            const errorBox = document.getElementById('error-message');

            btn.innerHTML = 'Signing in...';
            btn.classList.add('opacity-75', 'cursor-not-allowed');
            errorBox.classList.add('hidden');

            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = "progress.html";
            } catch (error) {
                btn.innerHTML = 'Sign In';
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
                errorBox.innerText = error.message.replace("Firebase: ", "");
                errorBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
